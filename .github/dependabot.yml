version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/wheel-smoke
    schedule:
      interval: weekly
    # A compromised release is usually caught and pulled within days; security updates skip the wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/stack_intel/ts
    # The TypeScript pin moves only in the TypeScript 7.1 release step; Dependabot would
    # propose nightly 7.1 builds, which sort above 7.1.0-beta.
    ignore:
      - dependency-name: typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
