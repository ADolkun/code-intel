[docs]
scope = ["README.md", "CHANGELOG.md", "docs/**/*.md"]

[docs.reachability]
root = "docs/README.md"
include = ["docs/**/*.md"]
exclude = []

[[docs.rules]]
paths = ["docs/docs-check.md"]
checks = ["links", "routes", "symbols", "commands"]
reason = "The page describes the docs check on an analyzed repository: its paths are the conventional agent-file locations, example globs and sample output the check reads there, not this repository's files."

[[docs.ignore]]
file = "README.md"
kind = "path"
text = ".stack-intel/requirements.txt"
reason = "Names the version pin an analyzed repository keeps; this repository does not launch stack-intel through a pin."

[[docs.ignore]]
file = "docs/install.md"
kind = "path"
text = ".stack-intel/requirements.txt"
reason = "Names the version pin an analyzed repository keeps; this repository does not launch stack-intel through a pin."

[[docs.ignore]]
file = "docs/analysis.md"
kind = "path"
text = ".stack-intel/requirements.txt"
reason = "Names the version pin an analyzed repository keeps; this repository does not launch stack-intel through a pin."

[[docs.ignore]]
